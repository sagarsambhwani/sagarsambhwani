name: Update Profile

on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs daily at midnight UTC
  workflow_dispatch:      # Can be triggered via API dispatch or manually
  repository_dispatch:    # Can be triggered from external repos via repository_dispatch event
    types: [update-portfolio]
  push:
    branches: [main]     # Runs whenever main branch is updated

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node update.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add README.md
          git diff --cached --quiet || git commit -m "Update live projects"
          git push
